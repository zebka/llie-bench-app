name: release

# Publishes per-ABI debug-signed APKs on a version tag (v*). Debug signing is
# deliberate: this is a sideloaded research tool, and the public release does
# not need the release keystore. Tag a commit to publish:
#   git tag v0.2.1 && git push origin v0.2.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + ABI-split debug APKs
        working-directory: .
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Organize assets
        shell: bash
        run: |
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME#v}"
          APK_DIR="app/build/outputs/apk/debug"
          for abi in armeabi-v7a arm64-v8a x86_64 universal; do
            src="$APK_DIR/app-${abi}-debug.apk"
            if [ -f "$src" ]; then
              cp "$src" "release-assets/llie-bench-${VERSION}-${abi}.apk"
            fi
          done
          cd release-assets
          sha256sum *.apk > SHA256SUMS
          ls -l

      - name: Verify the arm64 APK really carries the ONNX Runtime native lib
        shell: bash
        run: |
          jar tf release-assets/llie-bench-*-arm64-v8a.apk | grep -q "lib/arm64-v8a/libonnxruntime.so"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "LLIE mobile bench $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Debug-signed ABI-split builds (arm64-v8a, armeabi-v7a, x86_64, universal). Install the arm64-v8a APK on phones, x86_64 on emulators."
